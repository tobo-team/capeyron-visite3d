<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>T2 Capeyron, visite 3D</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #10151c; overflow: hidden; font-family: -apple-system, system-ui, sans-serif; }
  #c { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  .pastille { position: absolute; background: rgba(14,45,92,.62); color: #fff; border-radius: 14px; padding: 8px 14px; backdrop-filter: blur(6px); }
  #titre { top: 14px; left: 16px; }
  #titre b { display: block; font-size: 15px; }
  #titre span { font-size: 12px; opacity: .85; }
  #charge { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-weight: 600; background: #10151c; z-index: 2; }
  #pieces { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  #pieces button { border: 1px solid rgba(255,255,255,.55); background: rgba(14,45,92,.62); color: #fff; border-radius: 999px; padding: 9px 14px; font-size: 14px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="titre" class="pastille"><b>Capeyron, T2 de 46 m²</b><span>Mérignac · visite indicative, non contractuelle</span></div>
<div id="charge">Chargement de la visite…</div>
<div id="pieces"></div>
<script type="module" src="visite.mjs"></script>
</body>
</html>
